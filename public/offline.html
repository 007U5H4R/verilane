<!doctype html>
<!--
  TASK-35 (T24-5): served by public/sw.js for an offline navigation to a page
  that was never cached, instead of another page's HTML under the wrong URL.
  Self-contained (no Next.js chunks) so it renders from the cache alone.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline · Verilane</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        --bg: #f8f7f3;
        --surface: #ffffff;
        --border: #e4e1d8;
        --text: #17221c;
        --text-muted: #53605a;
        --accent: #0f3d29;
        --accent-text: #f3f8f5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #121a16;
          --surface: #17201c;
          --border: #283531;
          --text: #e7f0ea;
          --text-muted: #a9b8b0;
          --accent: #e7f0ea;
          --accent-text: #0a2419;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: 100%;
        max-width: 28rem;
        padding: 24px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      img {
        display: block;
        width: 40px;
        height: 40px;
        border-radius: 8px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.25rem;
        line-height: 1.3;
      }
      p {
        margin: 0 0 16px;
        color: var(--text-muted);
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 16px;
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline — this page wasn't saved for offline use</h1>
      <p>
        Pages you've opened before still work offline, with the data already loaded. This one
        will load when you're back online.
      </p>
      <a href="/">Go to Home</a>
    </main>
  </body>
</html>
